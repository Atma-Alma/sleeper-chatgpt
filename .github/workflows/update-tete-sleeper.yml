name: Update Tete Sleeper Data

on:
  workflow_dispatch:

  schedule:
    - cron: "37 * * * *"

  push:
    paths:
      - "Tete/refresh.trigger"
      - ".github/workflows/update-tete-sleeper.yml"

permissions:
  contents: write

jobs:
  update-tete-sleeper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and split Tete Sleeper data
        env:
          LEAGUE_ID: "1370052597343326208"
          TEAM_IDENTIFIER: "Timboslice796"
          OUTPUT_DIR: "Tete"

        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          LEAGUE_ID = os.environ["LEAGUE_ID"]
          TEAM_IDENTIFIER = os.environ["TEAM_IDENTIFIER"].strip()
          OUTPUT_DIR = os.environ["OUTPUT_DIR"]
          BASE = "https://api.sleeper.app/v1"
          GENERATED_AT = datetime.now(timezone.utc).isoformat()

          os.makedirs(OUTPUT_DIR, exist_ok=True)

          def get_json(url):
              print(f"Downloading: {url}")
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Sleeper-ChatGPT-Tete-Data-Feed/1.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def save_json(filename, data):
              path = os.path.join(OUTPUT_DIR, filename)
              with open(path, "w", encoding="utf-8") as file:
                  json.dump(data, file, indent=2, ensure_ascii=False)
              print(f"Saved {path}")

          def normalize(value):
              return str(value or "").strip().casefold()

          nfl_state = get_json(f"{BASE}/state/nfl")
          current_week = nfl_state.get("week", 1)

          league = get_json(f"{BASE}/league/{LEAGUE_ID}")
          users = get_json(f"{BASE}/league/{LEAGUE_ID}/users")
          rosters = get_json(f"{BASE}/league/{LEAGUE_ID}/rosters")
          drafts = get_json(f"{BASE}/league/{LEAGUE_ID}/drafts")
          matchups = get_json(
              f"{BASE}/league/{LEAGUE_ID}/matchups/{current_week}"
          )

          target = normalize(TEAM_IDENTIFIER)
          matching_users = []
          for user in users:
              metadata = user.get("metadata") or {}
              candidates = {
                  normalize(user.get("display_name")),
                  normalize(user.get("username")),
                  normalize(metadata.get("team_name")),
              }
              if target in candidates:
                  matching_users.append(user)

          if not matching_users:
              available = []
              for user in users:
                  metadata = user.get("metadata") or {}
                  available.append({
                      "user_id": user.get("user_id"),
                      "display_name": user.get("display_name"),
                      "team_name": metadata.get("team_name")
                  })
              raise RuntimeError(
                  f"Could not find Sleeper user/team '{TEAM_IDENTIFIER}'. "
                  f"League users: {available}"
              )

          if len(matching_users) > 1:
              print(
                  f"Warning: multiple users matched {TEAM_IDENTIFIER}; "
                  "using the first exact match."
              )

          target_user = matching_users[0]
          TARGET_OWNER_ID = str(target_user.get("user_id"))
          print(
              f"Resolved {TEAM_IDENTIFIER} to Sleeper owner ID "
              f"{TARGET_OWNER_ID}"
          )

          transactions = []
          for week in range(1, current_week + 1):
              try:
                  week_transactions = get_json(
                      f"{BASE}/league/{LEAGUE_ID}/transactions/{week}"
                  )
                  for tx in week_transactions:
                      tx["_week"] = week
                  transactions.extend(week_transactions)
              except Exception as exc:
                  print(
                      f"Could not retrieve transactions for week {week}: {exc}"
                  )

          try:
              trending_adds = get_json(
                  f"{BASE}/players/nfl/trending/add"
                  "?lookback_hours=24&limit=100"
              )
          except Exception as exc:
              print(f"Could not retrieve trending adds: {exc}")
              trending_adds = []

          try:
              trending_drops = get_json(
                  f"{BASE}/players/nfl/trending/drop"
                  "?lookback_hours=24&limit=100"
              )
          except Exception as exc:
              print(f"Could not retrieve trending drops: {exc}")
              trending_drops = []

          all_players = get_json(f"{BASE}/players/nfl")

          rostered_ids = set()
          for roster in rosters:
              for player_id in roster.get("players") or []:
                  rostered_ids.add(str(player_id))

          useful_positions = {"QB", "RB", "WR", "TE", "K"}
          player_lookup = {}
          available_players = []

          for player_id, player in all_players.items():
              position = player.get("position")
              if position not in useful_positions:
                  continue

              info = {
                  "player_id": player_id,
                  "full_name": player.get("full_name"),
                  "first_name": player.get("first_name"),
                  "last_name": player.get("last_name"),
                  "position": position,
                  "team": player.get("team"),
                  "status": player.get("status"),
                  "active": player.get("active"),
                  "injury_status": player.get("injury_status"),
                  "injury_body_part": player.get("injury_body_part"),
                  "years_exp": player.get("years_exp"),
                  "age": player.get("age"),
                  "number": player.get("number"),
                  "depth_chart_position": player.get("depth_chart_position"),
                  "depth_chart_order": player.get("depth_chart_order")
              }

              player_lookup[player_id] = info

              if (
                  player_id not in rostered_ids
                  and player.get("active") is True
                  and player.get("team")
              ):
                  available_players.append(info)

          available_players.sort(
              key=lambda p: (
                  p.get("position") or "",
                  p.get("depth_chart_order")
                  if isinstance(p.get("depth_chart_order"), int)
                  else 99,
                  p.get("team") or "",
                  p.get("full_name") or ""
              )
          )

          readable_rosters = []
          for roster in rosters:
              readable_players = []
              starter_ids = {str(x) for x in roster.get("starters") or []}
              reserve_ids = {str(x) for x in roster.get("reserve") or []}

              for player_id in roster.get("players") or []:
                  player_id = str(player_id)

                  if player_id in player_lookup:
                      player_info = dict(player_lookup[player_id])
                  else:
                      player_info = {
                          "player_id": player_id,
                          "full_name": player_id,
                          "position": "DEF",
                          "team": player_id
                      }

                  player_info["starter"] = player_id in starter_ids
                  player_info["reserve"] = player_id in reserve_ids
                  readable_players.append(player_info)

              readable_rosters.append({
                  "roster_id": roster.get("roster_id"),
                  "owner_id": roster.get("owner_id"),
                  "players": readable_players,
                  "waiver_position": roster.get("settings", {}).get("waiver_position"),
                  "waiver_budget_used": roster.get("settings", {}).get("waiver_budget_used"),
                  "wins": roster.get("settings", {}).get("wins"),
                  "losses": roster.get("settings", {}).get("losses"),
                  "ties": roster.get("settings", {}).get("ties")
              })

          owners = {}
          for user in users:
              metadata = user.get("metadata") or {}
              owners[str(user.get("user_id"))] = {
                  "user_id": user.get("user_id"),
                  "username": user.get("display_name"),
                  "team_name": metadata.get("team_name")
              }

          roster_owner_lookup = {}
          for roster in readable_rosters:
              owner_id = str(roster.get("owner_id"))
              roster_owner_lookup[roster["roster_id"]] = {
                  "roster_id": roster["roster_id"],
                  "owner": owners.get(owner_id),
                  "waiver_position": roster.get("waiver_position")
              }

          def enrich_trending(items):
              enriched = []
              for item in items:
                  player_id = str(item.get("player_id"))
                  player = dict(
                      player_lookup.get(
                          player_id,
                          {
                              "player_id": player_id,
                              "full_name": player_id
                          }
                      )
                  )
                  player["trend_count"] = item.get("count")
                  enriched.append(player)
              return enriched

          target_roster = next(
              (
                  roster
                  for roster in readable_rosters
                  if str(roster.get("owner_id")) == TARGET_OWNER_ID
              ),
              None
          )

          target_owner = owners.get(TARGET_OWNER_ID)
          target_matchup = None
          target_opponent = None

          if target_roster:
              target_roster_id = target_roster.get("roster_id")
              target_matchup = next(
                  (
                      matchup
                      for matchup in matchups
                      if matchup.get("roster_id") == target_roster_id
                  ),
                  None
              )

              if target_matchup and target_matchup.get("matchup_id") is not None:
                  opponent_matchup = next(
                      (
                          matchup
                          for matchup in matchups
                          if matchup.get("matchup_id")
                          == target_matchup.get("matchup_id")
                          and matchup.get("roster_id") != target_roster_id
                      ),
                      None
                  )

                  if opponent_matchup:
                      opponent_roster_id = opponent_matchup.get("roster_id")
                      opponent_roster = next(
                          (
                              roster
                              for roster in readable_rosters
                              if roster.get("roster_id") == opponent_roster_id
                          ),
                          None
                      )
                      target_opponent = {
                          "matchup": opponent_matchup,
                          "roster": opponent_roster,
                          "owner": roster_owner_lookup.get(
                              opponent_roster_id, {}
                          ).get("owner")
                      }

          if not target_roster:
              raise RuntimeError(
                  f"Resolved owner {TARGET_OWNER_ID}, but no roster was found "
                  f"for {TEAM_IDENTIFIER}."
              )

          common = {
              "generated_at": GENERATED_AT,
              "profile_name": "Tete",
              "team_identifier": TEAM_IDENTIFIER,
              "league_id": LEAGUE_ID,
              "owner_id": TARGET_OWNER_ID,
              "current_week": current_week
          }

          combined_output = {
              **common,
              "nfl_state": nfl_state,
              "league": league,
              "owners": owners,
              "rosters": readable_rosters,
              "raw_rosters": rosters,
              "matchups": matchups,
              "transactions": transactions,
              "drafts": drafts,
              "trending_adds_24h": trending_adds,
              "trending_drops_24h": trending_drops,
              "available_players": available_players
          }

          my_team_output = {
              **common,
              "league_name": league.get("name"),
              "scoring_settings": league.get("scoring_settings"),
              "roster_positions": league.get("roster_positions"),
              "owner": target_owner,
              "roster": target_roster,
              "matchup": target_matchup,
              "opponent": target_opponent
          }

          rosters_output = {
              **common,
              "league_name": league.get("name"),
              "owners": owners,
              "rosters": readable_rosters
          }

          waivers_output = {
              **common,
              "league_name": league.get("name"),
              "my_waiver_position": target_roster.get("waiver_position"),
              "my_waiver_budget_used": target_roster.get("waiver_budget_used"),
              "league_waiver_budget": league.get("settings", {}).get("waiver_budget"),
              "trending_adds_24h": enrich_trending(trending_adds),
              "trending_drops_24h": enrich_trending(trending_drops),
              "available_players": available_players
          }

          matchups_output = {
              **common,
              "league_name": league.get("name"),
              "roster_owners": roster_owner_lookup,
              "matchups": matchups
          }

          transactions_output = {
              **common,
              "league_name": league.get("name"),
              "transactions": transactions
          }

          save_json("sleeper-chatgpt.json", combined_output)
          save_json("my-team.json", my_team_output)
          save_json("rosters.json", rosters_output)
          save_json("waivers.json", waivers_output)
          save_json("matchups.json", matchups_output)
          save_json("transactions.json", transactions_output)

          print()
          print("Tete Sleeper data successfully generated.")
          print(f"League: {league.get('name')}")
          print(f"Team identifier: {TEAM_IDENTIFIER}")
          print(f"Owner ID: {TARGET_OWNER_ID}")
          print(f"Current week: {current_week}")
          print(f"Rosters: {len(rosters)}")
          print(f"Available active players: {len(available_players)}")
          print(f"Transactions: {len(transactions)}")
          PY

      - name: Commit updated Tete Sleeper data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Tete/sleeper-chatgpt.json \
            Tete/my-team.json \
            Tete/rosters.json \
            Tete/waivers.json \
            Tete/matchups.json \
            Tete/transactions.json

          if git diff --cached --quiet; then
            echo "Tete Sleeper data has not changed."
            exit 0
          fi

          git commit -m "Update Tete Sleeper data"
          git push
